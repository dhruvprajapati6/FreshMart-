<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreshMart</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        .split-layout {
            min-height: 100vh;
            display: flex;
            flex-wrap: wrap;
        }
        .split-left {
            flex: 1;
            min-width: 300px;
            background: url('img/hero.jpg') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .split-left::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 179, 126, 0.7);
        }
        .split-left-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 3rem;
            max-width: 500px;
        }
        .split-right {
            flex: 1;
            min-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f6fff9 0%, #e0f5ea 100%);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            margin: 0;
            padding: 0;
        }
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 179, 126, 0.15);
            bottom: -160px;
            animation: square 25s infinite;
            transition-timing-function: linear;
            border-radius: 50%;
        }
        .bg-bubbles li:nth-child(1) { left: 10%; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(0, 179, 126, 0.25); }
        .bg-bubbles li:nth-child(5) { left: 70%; }
        .bg-bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(0, 179, 126, 0.2); }
        .bg-bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bg-bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bg-bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(0, 179, 126, 0.3); }
        .bg-bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }
        @keyframes square {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1200px) rotate(600deg); opacity: 0; }
        }
        .auth-form-container {
            width: 100%;
            max-width: 450px;
            z-index: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,179,126,0.1);
            position: relative;
        }
        
        /* Smooth animation on the background image */
        .split-left {
            background-size: 110%;
            animation: panImage 30s linear infinite alternate;
        }
        @keyframes panImage {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .form-control {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(0, 179, 126, 0.15);
            border-color: var(--primary-color);
        }
        .btn-social {
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            font-weight: 500;
            color: #444;
            transition: all 0.3s;
        }
        .btn-social:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Image Side -->
        <div class="split-left" data-aos="fade-right" data-aos-duration="1000">
            <div class="split-left-content" data-aos="zoom-in" data-aos-delay="300" data-aos-duration="1000">
                <a href="index.html" class="text-white text-decoration-none fs-2 fw-bold mb-4 d-inline-block">
                    <i class="bi bi-basket2-fill me-2"></i>Fresh<span>Mart</span>
                </a>
                <h1 class="fw-bold display-5 mb-3 text-white">Shop the freshest organic produce daily.</h1>
                <p class="fs-5 text-white-50">Join thousands of happy customers and get your groceries delivered in minutes.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="split-right" data-aos="fade-left" data-aos-duration="1000">
            <ul class="bg-bubbles">
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
            </ul>
            <div class="auth-form-container">
                <div class="d-md-none mb-5 text-center" data-aos="fade-down" data-aos-delay="200">
                    <a href="index.html" class="text-primary-custom text-decoration-none fs-1 fw-bold">
                        <i class="bi bi-basket2-fill me-2"></i>Fresh<span class="text-secondary-custom">Mart</span>
                    </a>
                </div>
                
                <h2 class="fw-bold mb-2" data-aos="fade-up" data-aos-delay="300">Welcome Back! 👋</h2>
                <p class="text-muted mb-4 pb-2" data-aos="fade-up" data-aos-delay="400">Please enter your details to sign in.</p>
                
                <form action="login_action.php" method="POST" data-aos="fade-up" data-aos-delay="500">
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label fw-semibold small mb-0">Password</label>
                            <a href="#" class="text-primary-custom small text-decoration-none fw-semibold">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" class="form-control mt-2" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">Remember me for 30 days</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-4 rounded-3 fs-6">Sign In</button>
                    

                    
                    <div class="text-center mt-4 pt-2">
                        <p class="mb-0 text-muted">Don't have an account? <a href="register.html" class="text-primary-custom fw-bold text-decoration-none ms-1">Sign up for free</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 50,
            duration: 800,
            easing: 'ease-in-out-cubic',
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
