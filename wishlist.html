<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - FreshMart</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Preloader -->
    

    <!-- Header -->
    <header class="fixed-top shadow-sm">
        <div class="header-top text-center d-none d-lg-block">
            <div class="container">
                <span class="small translate-text"><i class="bi bi-truck me-2"></i> Free delivery on orders over $50 | 100% Organic Products</span>
            </div>
        </div>
        
        <nav class="navbar navbar-expand-lg py-3 navbar-glass">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand" href="index.html">
                    <i class="bi bi-basket2-fill text-primary-custom me-2"></i>Fresh<span>Mart</span>
                </a>
                
                <!-- Mobile Toggle -->
                <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Navigation & Actions -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="shop.html">Shop</a>
                        </li>
                        
                        
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                    
                    <!-- Right Actions -->
                    <div class="d-flex align-items-center mt-3 mt-lg-0">
                        <div class="search-container d-none d-lg-block me-3">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" class="search-input" placeholder="Search products...">
                        </div>
                        
                        <a href="login.html" class="header-action-icon" title="Login/Register">
                            <i class="bi bi-person"></i>
                        </a>
                        <a href="wishlist.html" class="header-action-icon" title="Wishlist">
                            <i class="bi bi-heart"></i>
                            <span class="badge-count">0</span>
                        </a>
                        <a href="cart.html" class="header-action-icon" title="Cart">
                            <i class="bi bi-cart3"></i>
                            <span class="badge-count">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Page Header -->
    <div class="container-fluid bg-light py-4" style="margin-top: 140px;">
        <div class="container text-center">
            <h1 class="fw-bold">My Wishlist</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb justify-content-center mb-0">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Wishlist Grid Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4 mb-5">
                
                <!-- Dynamic wishlist products will be injected here by main.js -->
                <div class="row g-4 mb-5" id="wishlist-items-container"></div>

            </div>
            
            <!-- Empty Wishlist State (Hidden by default, shown when empty) -->
            <!--
            <div class="text-center py-5">
                <i class="bi bi-heart text-muted" style="font-size: 5rem;"></i>
                <h3 class="fw-bold mt-4">Your wishlist is empty</h3>
                <p class="text-muted mb-4">You don't have any products in your wishlist yet. Explore our shop and find something you like!</p>
                <a href="shop.html" class="btn btn-primary-custom px-4 py-2">Go to Shop</a>
            </div>
            -->
            
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer mt-0">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 FreshMart. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
