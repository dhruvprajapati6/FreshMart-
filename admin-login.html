<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FreshMart</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/style.css" rel="stylesheet">
    <style>
        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2D3748;
        }
        .admin-login-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .admin-login-header {
            background-color: var(--primary-color);
            padding: 30px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <h2 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Admin Panel</h2>
                <p class="mb-0 mt-2 opacity-75">FreshMart E-Commerce</p>
            </div>
            
            <div class="p-4 p-md-5">
                <form action="admin-dashboard.html">
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Admin Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="email" class="form-control bg-light border-start-0 py-2" placeholder="admin@freshmart.com" value="admin@freshmart.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-light border-start-0 py-2" placeholder="••••••••" value="password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn w-100 py-2 fw-bold text-white mb-3" style="background-color: var(--primary-color);">Secure Login</button>
                    
                    <div class="text-center">
                        <a href="../index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Store</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
